  <script>
    // Telefonda arayüz %85 ölçekte (Amor'daki gibi): sayfa daha geniş çizilip ekrana sığdırılır.
    // Ölçek sabit: dokunurken / yazı kutusuna odaklanınca iOS yakınlaştırmasın.
    (function () {
      var UI_SCALE = 0.85, sw = Math.min(screen.width, screen.height);
      if (sw >= 600) return;
      var w = Math.round(sw / UI_SCALE), s = (sw / w).toFixed(4);
      document.querySelector('meta[name=viewport]').setAttribute('content',
        'width=' + w + ', initial-scale=' + s + ', minimum-scale=' + s + ', maximum-scale=' + s + ', user-scalable=no, viewport-fit=cover');
    })();
  </script>
  <script>
    // 🩺 açılışta bir hata olursa ekranda göster (telefonda konsol yok)
    (function () {
      var shown = 0;
      function show(msg) {
        if (shown++ > 4) return;
        var b = document.getElementById('bootErr');
        if (!b) {
          b = document.createElement('pre'); b.id = 'bootErr';
          b.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:99999;max-height:45vh;overflow:auto;margin:0;padding:10px;background:#300;color:#fff;font:12px/1.4 monospace;white-space:pre-wrap;border-radius:8px';
          (document.body || document.documentElement).appendChild(b);
        }
        if (!b.firstChild) {
          var fix = document.createElement('button');
          fix.textContent = '🧹 Önbelleği temizle ve yenile (veriler kalır)';
          fix.style.cssText = 'display:block;margin:0 0 8px;padding:8px 10px;border:0;border-radius:6px;background:#fff;color:#300;font:600 13px sans-serif';
          fix.onclick = function () {
            var p = [];
            try { if (window.caches) p.push(caches.keys().then(function (k) { return Promise.all(k.map(function (x) { return caches.delete(x); })); })); } catch (e) {}
            try { if (navigator.serviceWorker) p.push(navigator.serviceWorker.getRegistrations().then(function (r) { return Promise.all(r.map(function (x) { return x.unregister(); })); })); } catch (e) {}
            Promise.all(p).then(function () { location.replace(location.pathname + '?r=' + Date.now()); }, function () { location.reload(); });
          };
          b.appendChild(fix);
          b.appendChild(document.createTextNode('⚠️ Hata (ekran görüntüsü alıp gönder):'));
        }
        b.appendChild(document.createTextNode('\n\n' + msg));
      }
      // ⏱️ sayfa yüklendikten 6 sn sonra (ya da yükleme 60 sn'de bitmezse) açılış ekranı hâlâ duruyorsa teşhis bilgisi
      var checked = 0;
      function watch(why) {
        var sp = document.getElementById('splash');
        if (checked++ || !sp || sp.classList.contains('hide') || sp.classList.contains('busy')) return;
        var S = window.Stories || {}, miss = [];
        ['Store', 'I18n', 'Bot', 'MONIA', 'SCENES', 'PHOTO_TXT', 'City'].forEach(function (k) { if (!S[k]) miss.push(k); });
        var ls = 0; try { for (var i = 0; i < localStorage.length; i++) { var k = localStorage.key(i); ls += k.length + (localStorage.getItem(k) || '').length; } } catch (e) { ls = -1; }
        show('Açılış bitmedi (' + why + ').\nEksik: ' + (miss.join(', ') || 'yok') + '\nlocalStorage: ' + ls + ' karakter\nSW: ' + (navigator.serviceWorker && navigator.serviceWorker.controller ? 'açık' : 'yok') + '\n' + navigator.userAgent);
      }
      window.addEventListener('load', function () { setTimeout(function () { watch('yüklendi + 6 sn'); }, 6000); });
      setTimeout(function () { if (document.readyState !== 'complete') watch('60 sn, yükleme sürüyor'); }, 60000);
      window.addEventListener('error', function (e) {
        var t = e.target;
        if (t && t !== window && (t.src || t.href)) { if (t.tagName === 'SCRIPT') show('Yüklenemedi: ' + t.src); return; }
        show((e.message || 'Error') + '\n' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ':' + e.colno);
      }, true);
      window.addEventListener('unhandledrejection', function (e) { show('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)); });
      window.__bootErr = show;
    })();
  </script>
  <script>
    // 🌙 tema (Ben → Ayarlar): light | dark | auto (sistem); sayfa çizilmeden önce uygulanır, beyaz parlama olmaz
    (function () {
      var t = 'light';
      try { t = localStorage.getItem('amor-stories:theme') || 'light'; } catch (e) {}
      var dark = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>

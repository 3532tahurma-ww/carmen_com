  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <script>
    // Telefonda arayüz %85 ölçekte (Amor'daki gibi): sayfa daha geniş çizilip ekrana sığdırılır.
    // Ölçek sabit: dokunurken / yazı kutusuna odaklanınca iOS yakınlaştırmasın.
    (function () {
      var UI_SCALE = 0.85, sw = Math.min(screen.width, screen.height);
      if (sw >= 600) return;
      var w = Math.round(sw / UI_SCALE), s = (sw / w).toFixed(4);
      document.querySelector('meta[name=viewport]').setAttribute('content',
        'width=' + w + ', initial-scale=' + s + ', minimum-scale=' + s + ', maximum-scale=' + s + ', user-scalable=no, viewport-fit=cover');
    })();
  </script>
  <script>
    // 🌙 tema (Ben → Ayarlar): light | dark | auto (sistem); sayfa çizilmeden önce uygulanır, beyaz parlama olmaz
    (function () {
      var t = 'light';
      try { t = localStorage.getItem('amor-stories:theme') || 'light'; } catch (e) {}
      var dark = t === 'dark' || (t === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
      document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    })();
  </script>
  <meta name="theme-color" content="#0089c4">
